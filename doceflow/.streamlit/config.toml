[theme]
base = "light"
primaryColor = "#E0628A"
backgroundColor = "#FDE8EC"
secondaryBackgroundColor = "#FFF6F8"
borderColor = "#F4A7BB"
textColor = "#5C3317"

[client]
showErrorDetails = false
# O menu lateral é controlado pelo app.py (st.navigation): escondido para visitantes,
# visível só depois do login administrativo.
toolbarMode = "minimal"

[server]
# Fotos do Estúdio de Marketing: até 10 MB (também validado no código)
maxUploadSize = 10
